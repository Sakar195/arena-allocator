name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Compiler
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Run Tests with Sanitizers
        run: make test

      - name: Run Basic Example
        run: make basic

      - name: Run Benchmark
        run: make bench
